hero:
  subtitle: 自由、免費、開源的台灣話拍字家私
about:
  title: 關於台語齒盤
  paragraphs:
  - 台語齒盤是一个自由、開源 ê 台語拍字家私，拍字 ia̋n-jín 由台灣人家己開發，照台語 ê 拍字習慣設計。支援 iOS、Android、macOS、Windows、Linux，會當用白話字、教育部台羅佮方音符號拍字。
  - 台語齒盤永遠免費、無廣告，嘛袂推出付費功能。毋管是一般使用者、先生、學校抑是台語教育團體，攏會當自由使用。希望予逐家用台語、教台語 ê 時，免有額外 ê 負擔。
  - 這个計畫目前由我一个人利用上班以外 ê 時間開發佮維護，所需要 ê 費用主要由我家己負擔，向望台語齒盤會當一直維持落去，予逐家想欲用母語拍字 ê 人，攏有一个好用
    ê 家私。
how_to_type:
  notes:
  - 若拍漢字，會自動使用全形標點符號，拍羅馬字會自動切去半形標點符號，建議 ê 候選詞會顯示佇頂頭，嘛會使褫開看較清楚。
install:
  platforms:
  - id: ios
    label: iPhone / iPad
    steps:
    - description: 佇手機仔的 App Store 揣「台語齒盤」安裝。
    - description: 安裝了後，去【設定】>【一般】>【齒盤】。
    - description: 點【齒盤】>【加入台語齒盤】>【允准完整取用】。
    - description: 當咧拍字的 APP 愛重開才會看著齒盤。
    - description: 揤地球圖示看著「台語齒盤」，就是裝好矣。
  - id: android
    label: Android
    steps:
    - description: 佇手機仔的 Google Play Store 揣「台語齒盤」安裝。
    - description: 安裝了後，去【設定】>【一般】>【齒盤】。
    - description: 加入【台語齒盤】。
    - description: 當咧拍字的 APP 愛重開才會看著齒盤。
    - description: 揤地球圖示看著「台語齒盤」，就是裝好矣。
  - id: macos
    label: macOS
    requires: macos
    steps:
    - description: 頂頭 táng-lóo 台語齒盤 macOS 安裝檔。
    - description: 依照安裝畫面安裝。
    - description: 安裝了後，登出/登入電腦一擺，予系統重新掠輸入法。
    - description: 拍開電腦設定，揣【台語齒盤】加入，若電腦英語揣 taigikeyboard。
    - description: 揤 control + cmd + S 拍開齒盤設定、調整設定，就會使拍字矣
  - id: windows
    label: Windows
    requires: windows
    steps:
    - description: 頂頭 táng-lóo 台語齒盤 Windows 安裝檔。
    - description: 共安裝檔連紲點兩下，**電腦會跳出警告**，揤其他資訊 → 仍要執行。
    - description: "【設定與語言】>【語言與地區】>【選項】>【齒盤】>【已安裝的鍵盤】>【增加齒盤】。"
    - description: 安裝了後，登出/登入電腦一擺，予系統重新掠輸入法。
    - description: 拍開電腦設定，揣【台語齒盤】加入，若電腦英語揣 taigikeyboard。
    - description: 揤 control + alt + S 拍開齒盤設定、調整設定，就會使拍字矣
  - id: linux
    label: Linux
    requires: linux
    steps:
    - description: 頂頭 táng-lóo 台語齒盤 Linux 安裝檔：Ubuntu/Debian 用 .deb、Fedora 用 .rpm、Arch
        用 .pkg.tar.zst（x86_64）。
    - description: 拍開終端機，Ubuntu/Debian 拍 sudo apt install ./taigikeyboard_版本_amd64.deb；Fedora
        拍 sudo dnf install ./taigikeyboard-版本-1.x86_64.rpm；Arch 拍 sudo pacman -U ./taigikeyboard-版本-1-x86_64.pkg.tar.zst。
    - description: 安裝了後，拍 fcitx5 -r（用 IBus 就用 ibus restart），抑是登出/登入電腦一擺。
    - description: Fcitx5 拍開 fcitx5-configtool、IBus 拍開系統設定的輸入來源，揣【台語齒盤】加入，若電腦英語揣 taigikeyboard。
    - description: 揤 control + alt + S 拍開齒盤設定、調整設定，就會使拍字矣
  signing_note_html: >-
    Windows 版本目前猶未簽章。<a href="/codesigning.html">程式碼簽章政策</a>
