- title: 表情齒盤，拍出這馬 ê 心情
  description: 毋免離開齒盤，直接揀表情、切換分類，揣著你想欲 ê 表情。
- title: 智慧選字，愈拍愈順
  description: 齒盤會照你 ê 拍字習慣排列佮建議詞，齒盤愈用愈巧。
- title: 家己訂做齒盤
  description: 自由揀色水、字型佮齒盤主題，設定合你慣勢 ê 拍字畫面。
- title: 無仝詞庫在你揀
  description: 教育部用字、非教育部用字、在來字佮異用字，照家己 ê 習慣來揀。
- title: 無連網路，安心拍字
  description: 台語齒盤無連網路、無錄音，拍 ê 內容嘛袂送出去，資料攏佇手機仔內底。
