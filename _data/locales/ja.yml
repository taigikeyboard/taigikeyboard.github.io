hero:
  subtitle: 台湾語で書こう
about:
  title: TaigiKeyboardについて
  paragraphs:
  - TaigiKeyboard（台語齒盤）は、台湾語を入力するための無料のオープンソース入力メソッドです。台湾の開発者が台湾語の入力に合わせて設計しました。iOS、Android、macOS、Windows、Linuxに対応し、白話字（POJ）、教育部台湾語ローマ字（TL）、台湾語方音符号（TPS）で入力できます。
  - 今後も無料で提供し、広告や有料機能を導入する予定はありません。個人、教員、学校、台湾語教育団体など、どなたでも自由にご利用いただけます。台湾語の使用や教育に、余分な費用がかからないことを目指しています。
  - このプロジェクトは、私が仕事以外の時間に一人で開発・保守し、必要な費用の多くを自己負担しています。母語で文字を入力したいすべての人に使いやすい道具を届けられるよう、開発を続けていきたいと考えています。
how_to_type:
  notes:
  - 漢字入力では全角、ローマ字入力では半角の句読点に自動で切り替わります。変換候補はキーボードの上に表示され、候補欄を広げることもできます。
install:
  platforms:
  - id: ios
    label: iPhone / iPad
    steps:
    - description: iPhoneまたはiPadのApp Storeで「TaigiKeyboard」または「台語齒盤」を検索し、インストールします。
    - description: "「設定」>「一般」>「キーボード」を開きます。"
    - description: "「キーボード」>「新しいキーボードを追加」でTaigiKeyboardを選び、「フルアクセスを許可」を有効にします。"
    - description: 入力に使うアプリを開き直してください。
    - description: 地球のアイコンをタップしてTaigiKeyboardを選ぶと、入力できます。
  - id: android
    label: Android
    steps:
    - description: Google Playで「TaigiKeyboard」または「台語齒盤」を検索し、インストールします。
    - description: 端末の設定でキーボード、または画面キーボードの設定を開きます。設定の場所は端末によって異なります。
    - description: キーボード一覧でTaigiKeyboardを有効にします。
    - description: 入力に使うアプリを開き直してください。
    - description: キーボード切り替えボタンでTaigiKeyboardを選びます。
  - id: macos
    label: macOS
    requires: macos
    steps:
    - description: 上のボタンからmacOS用インストーラーをダウンロードします。
    - description: 画面の案内に従ってインストールします。
    - description: 入力メソッドを読み込むため、一度ログアウトしてからログインし直します。
    - description: 入力ソースの設定を開き、TaigiKeyboard（台語齒盤）を追加します。
    - description: Control + Command + Sで設定を開き、調整してから入力を始めます。
  - id: windows
    label: Windows
    requires: windows
    steps:
    - description: 上のボタンからWindows用インストーラーをダウンロードします。
    - description: インストーラーを実行します。Windowsの警告が表示された場合は「詳細情報」>「実行」を選びます。
    - description: "「設定」>「時刻と言語」>「言語と地域」>「言語のオプション」>「キーボード」>「キーボードの追加」を開きます。"
    - description: 入力メソッドを読み込むため、一度ログアウトしてからログインし直します。
    - description: キーボード一覧からTaigiKeyboard（台語齒盤）を追加します。
    - description: Control + Alt + Sで設定を開き、調整してから入力を始めます。
  - id: linux
    label: Linux
    requires: linux
    steps:
    - description: 上のボタンからLinux用パッケージをダウンロードします。Ubuntu/Debianは.deb、Fedoraは.rpm、Archは.pkg.tar.zst（x86_64）を選びます。
    - description: 端末で、Ubuntu/Debianは sudo apt install ./taigikeyboard_VERSION_amd64.deb、Fedoraは
        sudo dnf install ./taigikeyboard-VERSION-1.x86_64.rpm、Archは sudo pacman -U
        ./taigikeyboard-VERSION-1-x86_64.pkg.tar.zst を実行します。VERSIONはダウンロードしたバージョンに置き換えてください。
    - description: fcitx5 -r（IBusの場合は ibus restart）を実行するか、ログアウトしてからログインし直します。
    - description: Fcitx5は fcitx5-configtool、IBusはシステムの入力ソース設定を開き、TaigiKeyboard（台語齒盤）を追加します。
    - description: Control + Alt + Sで設定を開き、調整してから入力を始めます。
  signing_note_html: <a href="/codesigning.html"><strong>コード署名ポリシー / Code signing
    policy（英語）</strong></a>：Free code signing provided by <a href="https://about.signpath.io"
