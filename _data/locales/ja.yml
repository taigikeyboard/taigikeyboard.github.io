hero:
  subtitle: 自由に使える、無料・オープンソースの台湾語入力ツール
about:
  title: TaigiKeyboardについて
  paragraphs:
  - TaigiKeyboard（台語齒盤）は、台湾語を入力するための無料のオープンソース入力メソッドです。台湾の開発者が台湾語の入力に合わせて設計しました。iOS、Android、macOS、Windows、Linuxに対応し、白話字（POJ）、教育部台湾語ローマ字（TL）、台湾語方音符号（TPS）で入力できます。
  - 今後も無料で提供し、広告や有料機能を導入する予定はありません。個人、教員、学校、台湾語教育団体など、どなたでも自由にご利用いただけます。台湾語の使用や教育に、余分な費用がかからないことを目指しています。
  - このプロジェクトは、私が仕事以外の時間に一人で開発・保守し、必要な費用の多くを自己負担しています。母語で文字を入力したいすべての人に使いやすい道具を届けられるよう、開発を続けていきたいと考えています。
how_to_type:
  notes:
  - 漢字入力では全角、ローマ字入力では半角の句読点に自動で切り替わります。変換候補はキーボードの上に表示され、候補欄を広げることもできます。
install:
  previous: 前へ
  next: 次へ
  step_label: 手順
  platforms:
  - id: ios
    label: iPhone / iPad
    steps:
    - description: iPhoneまたはiPadのApp Storeで「TaigiKeyboard」または「台語齒盤」を検索し、インストールします。
    - description: "「設定」>「一般」>「キーボード」を開きます。"
    - description: "「キーボード」>「新しいキーボードを追加」でTaigiKeyboardを選び、「フルアクセスを許可」を有効にします。"
    - description: 入力に使うアプリを開き直してください。
    - description: 地球のアイコンをタップしてTaigiKeyboardを選ぶと、入力できます。
  - id: android
    label: Android
    steps:
    - description: Google Playで「TaigiKeyboard」または「台語齒盤」を検索し、インストールします。
    - description: 端末の設定でキーボード、または画面キーボードの設定を開きます。設定の場所は端末によって異なります。
    - description: キーボード一覧でTaigiKeyboardを有効にします。
    - description: 入力に使うアプリを開き直してください。
    - description: キーボード切り替えボタンでTaigiKeyboardを選びます。
  - id: macos
    label: macOS
    requires: macos
    steps:
    - description: 上のmacOS用インストーラーを開き、「続ける」→「インストール」を選びます。
      screenshots: macos-install
    - description: "「システム設定」→「キーボード」から入力ソースの「編集」を開きます。"
      screenshots: macos-settings
    - description: "＋を押し、「台湾語」を検索して「台湾語キーボード」を追加します。"
      screenshots: macos-add
    - description: 入力メニューから選びます。表示されなければ再ログインします。Control + Command + Sで設定を開きます。
      screenshots: macos-done
  - id: windows
    label: Windows
    requires: windows
    steps:
    - description: 上のWindows用インストーラーを開きます。警告が出たら「詳細情報」→「実行」を選び、確認してインストールします。
      screenshots: windows-run
    - description: "「設定」→「時刻と言語」→「言語と地域」で、「繁体中国語 (台湾)」の「言語のオプション」を開きます。"
      screenshots: windows-language-options
    - description: キーボード一覧を確認し、なければ「キーボードの追加」から追加します。
      screenshots: windows-keyboard
    - description: Windows + Spaceで切り替えます。表示されなければ再ログインします。Control + Alt + Sで設定を開きます。
      screenshots: windows-switch
  - id: linux
    label: Linux
    requires: linux
    steps:
    - description: ディストリビューションに合ったパッケージを端末でインストールし、入力メソッドを再起動するか再ログインします。
      screenshots: linux-install
      commands_label: インストールコマンド
      commands_note: VERSIONをダウンロードしたバージョンに置き換えてください。
    - description: Fcitx5はfcitx5-configtoolで言語の絞り込みを解除し、taigiを検索します。IBusはシステムの入力ソースから追加します。
      screenshots: linux-find
    - description: キーボードを選び、左矢印→「適用」を押します。Control + Alt + Sで設定を開きます。
      screenshots: linux-add
