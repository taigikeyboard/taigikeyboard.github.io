features:
- title: 4つの入力モード
  description: 白話字、教育部台羅、方音符号、英語をキーボードから切り替えられます。
- title: 絵文字キーボード
  description: キーボードを閉じずに絵文字を検索し、分類から選べます。
- title: 入力に合わせた候補
  description: 入力の習慣に合わせて候補の順序やおすすめが変わります。
- title: 自分好みのキーボード
  description: 色、フォント、テーマを自由に選べます。
- title: 選べる辞書
  description: 教育部の表記、従来の表記、異体字など、好みに合わせて選べます。
- title: オフラインで入力
  description: ネット接続や録音は不要です。入力内容は端末内に保存されます。
