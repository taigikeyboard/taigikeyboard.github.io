hero:
  subtitle: A free and open-source Taiwanese input method
about:
  title: About TaigiKeyboard
  paragraphs:
  - TaigiKeyboard is a free, open-source Taiwanese input method, built in Taiwan around
    the needs of Taiwanese typing. It supports iOS, Android, macOS, Windows, and Linux,
    with Pe̍h-ōe-jī (POJ), Tâi-lô (TL), and Taiwanese Phonetic Symbols (TPS).
  - TaigiKeyboard will always be free, with no ads or paid features. Individuals,
    teachers, schools, and Taiwanese-language education groups are welcome to use
    it freely, without an extra cost for using or teaching the language.
  - I develop and maintain this project on my own outside work, covering most costs
    myself. I hope to keep it going so everyone who wants to type in their mother
    tongue has a useful tool.
how_to_type:
  notes:
  - Hanji input uses full-width punctuation; romanized input uses half-width punctuation.
    Suggested words appear above the keyboard, and the candidate panel can be expanded.
install:
  previous: Previous
  next: Next
  step_label: Step
  platforms:
  - id: ios
    label: iPhone / iPad
    steps:
    - description: Find TaigiKeyboard in the App Store on your iPhone or iPad and
        install it.
    - description: After installation, open Settings > General > Keyboard.
    - description: Open Keyboards > Add New Keyboard, choose TaigiKeyboard, and enable
        Allow Full Access.
    - description: Reopen the app you want to type in so it can load the keyboard.
    - description: Tap the globe icon and select TaigiKeyboard.
  - id: android
    label: Android
    steps:
    - description: Find TaigiKeyboard in Google Play and install it.
    - description: Open your device settings and find the keyboard or on-screen keyboard
        settings. The location varies by device.
    - description: Enable TaigiKeyboard in the keyboard list.
    - description: Reopen the app you want to type in.
    - description: Use the keyboard switcher to select TaigiKeyboard.
  - id: macos
    label: macOS
    requires: macos
    steps:
    - description: Download the macOS installer above. Open it, then choose Continue →
        Install.
      screenshots: macos-install
    - description: Open System Settings → Keyboard → Input Sources → Edit.
      screenshots: macos-settings
    - description: Click +, search taigi and add TaigiKeyboard.
      screenshots: macos-add
    - description: Select TaigiKeyboard from the input menu. If missing, log out and back
        in. Control + Command + S opens keyboard settings.
      screenshots: macos-done
  - id: windows
    label: Windows
    requires: windows
    steps:
    - description: Download and run the Windows installer above. If a warning appears,
        choose More info → Run anyway, then confirm installation.
      screenshots: windows-run
    - description: Open Settings → Time & language → Language & region. Choose Language
        options beside Chinese (Traditional, Taiwan).
      screenshots: windows-language-options
    - description: Look for TaigiKeyboard under Installed keyboards. If missing, choose
        Add a keyboard.
      screenshots: windows-keyboard
    - description: Press Windows + Space to select TaigiKeyboard. If missing, log out
        and back in. Control + Alt + S opens keyboard settings.
      screenshots: windows-switch
  - id: linux
    label: Linux
    requires: linux
    steps:
    - description: Download the package for your distribution and install it in a terminal.
        Restart the input method, or log out and back in.
      screenshots: linux-install
      commands_label: Installation commands
      commands_note: Replace VERSION with the downloaded version.
    - description: For Fcitx5, open fcitx5-configtool, clear Only Show Current Language
        and search taigi. For IBus, add TaigiKeyboard in system input sources.
      screenshots: linux-find
    - description: Select TaigiKeyboard, click the left arrow, then Apply. Control + Alt
        + S opens keyboard settings.
      screenshots: linux-add
