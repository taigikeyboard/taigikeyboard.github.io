hero:
  subtitle: Write in Taiwanese
about:
  title: About TaigiKeyboard
  paragraphs:
  - TaigiKeyboard is a free, open-source Taiwanese input method, built in Taiwan around
    the needs of Taiwanese typing. It supports iOS, Android, macOS, Windows, and Linux,
    with Pe̍h-ōe-jī (POJ), Tâi-lô (TL), and Taiwanese Phonetic Symbols (TPS).
  - TaigiKeyboard will always be free, with no ads or paid features. Individuals,
    teachers, schools, and Taiwanese-language education groups are welcome to use
    it freely, without an extra cost for using or teaching the language.
  - I develop and maintain this project on my own outside work, covering most costs
    myself. I hope to keep it going so everyone who wants to type in their mother
    tongue has a useful tool.
how_to_type:
  notes:
  - Hanji input uses full-width punctuation; romanized input uses half-width punctuation.
    Suggested words appear above the keyboard, and the candidate panel can be expanded.
install:
  platforms:
  - id: ios
    label: iPhone / iPad
    steps:
    - description: Find TaigiKeyboard in the App Store on your iPhone or iPad and
        install it.
    - description: After installation, open Settings > General > Keyboard.
    - description: Open Keyboards > Add New Keyboard, choose TaigiKeyboard, and enable
        Allow Full Access.
    - description: Reopen the app you want to type in so it can load the keyboard.
    - description: Tap the globe icon and select TaigiKeyboard.
  - id: android
    label: Android
    steps:
    - description: Find TaigiKeyboard in Google Play and install it.
    - description: Open your device settings and find the keyboard or on-screen keyboard
        settings. The location varies by device.
    - description: Enable TaigiKeyboard in the keyboard list.
    - description: Reopen the app you want to type in.
    - description: Use the keyboard switcher to select TaigiKeyboard.
  - id: macos
    label: macOS
    requires: macos
    steps:
    - description: Download the macOS installer above.
    - description: Follow the installation instructions.
    - description: Log out and back in so macOS can load the input method.
    - description: Open the input source settings and add TaigiKeyboard (台語齒盤).
    - description: Press Control + Command + S to open TaigiKeyboard settings, then
        start typing.
  - id: windows
    label: Windows
    requires: windows
    steps:
    - description: Download the Windows installer above.
    - description: Run the installer. If Windows shows a warning, choose More info
        > Run anyway.
    - description: Open Settings > Time & language > Language & region > Language
        options > Keyboards > Add a keyboard.
    - description: Log out and back in so Windows can load the input method.
    - description: Find TaigiKeyboard (台語齒盤) in the keyboard list and add it.
    - description: Press Control + Alt + S to open TaigiKeyboard settings, then start
        typing.
  - id: linux
    label: Linux
    requires: linux
    steps:
    - description: 'Download the Linux package above: .deb for Ubuntu/Debian, .rpm
        for Fedora, or .pkg.tar.zst for Arch (x86_64).'
    - description: In a terminal, run sudo apt install ./taigikeyboard_VERSION_amd64.deb
        on Ubuntu/Debian, sudo dnf install ./taigikeyboard-VERSION-1.x86_64.rpm on
        Fedora, or sudo pacman -U ./taigikeyboard-VERSION-1-x86_64.pkg.tar.zst on
        Arch. Replace VERSION with the downloaded version.
    - description: Run fcitx5 -r (or ibus restart for IBus), or log out and back in.
    - description: Open fcitx5-configtool for Fcitx5, or the system input source settings
        for IBus, and add TaigiKeyboard (台語齒盤).
    - description: Press Control + Alt + S to open TaigiKeyboard settings, then start
        typing.
