about:
  title: 關於台語齒盤
  paragraphs:
    - 台語齒盤是一个予逐家佇手機仔拍台語 ê 拍字家私，拍字 ia̋n-jín 由台灣人家己開發，照台灣人拍字 ê 習慣設計。支援 iOS 佮 Android，會當用白話字、教育部台羅佮方音符號拍字。
    - 台語齒盤永遠免費、無廣告，嘛袂推出付費功能。毋管是一般使用者、學校、先生抑是台語教育團體，攏會當自由使用。希望予逐家用台語、教台語 ê 時，毋免閣增加額外 ê 負擔。
    - 這个計畫目前由我一个人利用上班以外 ê 時間開發佮維護。所需要 ê 費用主要由我家己負擔，嘛有逐家 ê 贊助支持。向望台語齒盤會當一直維持落去，予逐个想欲用母語拍字 ê 人，攏有一个好用 ê 家私。

# =============================================================================
# Content - Screenshots Section
# =============================================================================

screenshots:
  platform_note: Android 佮 iOS 齒盤外觀有小可仔無仝，毋過使用體驗攏仝款。

# =============================================================================
# Content - How to Type Section
# =============================================================================

how_to_type:
  notes:
    - 若拍漢字，會自動使用全形標點符號，拍羅馬字會自動切去半形標點符號，建議 ê 候選詞會顯示佇頂頭，嘛會使褫開看較清楚。

# =============================================================================
# Content - How to Use Section
# =============================================================================

how_to_use:
  steps:
    - description: 【設定】>【一般/系統】>【齒盤】
      image: setup-1.png
      alt: 台語齒盤設定步驟：入去系統設定
    - description: 點【齒盤】>【加入台語齒盤】>【允准完整取用】
      image: setup-2.png
      alt: 台語齒盤設定步驟：加入鍵盤
  notes:
    - ※ 無仝牌子 ê 手機仔設定可能無仝，但是啟用方法攏差不多。
    - ※ 「允准完整取用」是予齒盤會當捌你揤 ê 動作，成做你拍 ê 字，請放心，台語齒盤袂偷錄任何資料。

# =============================================================================
