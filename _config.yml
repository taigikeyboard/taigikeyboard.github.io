# =============================================================================
# Content - About Section
# =============================================================================

about:
  title: 關於台語齒盤
  paragraphs:
    - 台語齒盤是一个台語 ê 拍字家私，拍字 ia̋n-jín 由台灣人家己開發，照台語 ê 拍字習慣設計。支援 iOS、Android、macOS、Windows，會當用白話字、教育部台羅佮方音符號拍字。
    - 台語齒盤永遠免費、無廣告，嘛袂推出付費功能。毋管是一般使用者、學校、先生抑是台語教育團體，攏會當自由使用。希望予逐家用台語、教台語 ê 時，毋免閣增加額外 ê 負擔。
    - 這个計畫目前由我一个人利用上班以外 ê 時間開發佮維護。所需要 ê 費用主要由我家己負擔，嘛有逐家 ê 贊助支持。向望台語齒盤會當一直維持落去，予逐个想欲用母語拍字 ê 人，攏有一个好用 ê 家私。

# =============================================================================
# Content - Screenshots Section
# =============================================================================

screenshots:
  platform_note: Android 佮 iOS 齒盤外觀有小可仔無仝，毋過使用體驗攏仝款。

# =============================================================================
# Content - How to Type Section
# =============================================================================

how_to_type:
  notes:
    - 若拍漢字，會自動使用全形標點符號，拍羅馬字會自動切去半形標點符號，建議 ê 候選詞會顯示佇頂頭，嘛會使褫開看較清楚。

# =============================================================================
# Content - Install Section
#
# One entry per platform. `requires` gates a platform on the matching
# enable_*_download switch above, so an unlaunched platform's instructions stay
# off the page along with its download button. Steps render without an image
# until `image` is filled in, so text can ship before the screenshots exist.
# =============================================================================

install:
  platforms:
    - id: ios
      label: iPhone / iPad
      steps:
        - description: 佇手機仔的 App Store 揣「台語齒盤」安裝。
        - description: 安裝了後，去【設定】>【一般】>【齒盤】。
        - description: 點【齒盤】>【加入台語齒盤】>【允准完整取用】。
        - description: 當咧拍字的 APP 愛重開才會看著齒盤。
        - description: 揤地球圖示看著「台語齒盤」，就是裝好矣。

    - id: android
      label: Android
      steps:
        - description: 佇手機仔的 Google Play Store 揣「台語齒盤」安裝。
        - description: 安裝了後，去【設定】>【一般】>【齒盤】。
        - description: 加入【台語齒盤】。
        - description: 當咧拍字的 APP 愛重開才會看著齒盤。
        - description: 揤地球圖示看著「台語齒盤」，就是裝好矣。

    - id: macos
      label: macOS
      requires: macos
      steps:
        - description: 頂頭 táng-lóo 台語齒盤 macOS 安裝檔。
        - description: 依照安裝畫面安裝。
        - description: 安裝了後，登出/登入電腦一擺，予系統重新掠輸入法。
        - description: 拍開電腦設定，揣【台語齒盤】加入，若電腦英語揣 taigikeyboard。
        - description: 揤 control + cmd + S 拍開齒盤設定、調整設定，就會使拍字矣

    - id: windows
      label: Windows
      requires: windows
      steps:
        - description: 頂頭 táng-lóo 台語齒盤 Windows 安裝檔。
        - description: 共安裝檔連紲點兩下，**電腦會跳出警告**，揤其他資訊 → 仍要執行。
        - description: 【設定與語言】>【語言與地區】>【選項】>【齒盤】>【已安裝的鍵盤】>【增加齒盤】。
        - description: 安裝了後，登出/登入電腦一擺，予系統重新掠輸入法。
        - description: 拍開電腦設定，揣【台語齒盤】加入，若電腦英語揣 taigikeyboard。
        - description: 揤 control + alt + S 拍開齒盤設定、調整設定，就會使拍字矣

