app_name: TaigiKeyboard 台語齒盤
app_description: 台語輸入法

ios_app_id: 6751871806
ios_app_country: TW
appstore_link: https://apps.apple.com/app/id6751871806
playstore_link: https://play.google.com/store/apps/details?id=com.siansiansu.taigikeyboard

enable_smart_app_banner: true
enable_features: false

# macOS is distributed from a GitHub release rather than a store, and the
# release flow fills _data/macos_release.json as soon as any package is
# published. Keep this false until the macOS launch is meant to be public: it
# hides the download button AND keeps the package URL out of the page's
# structured data.
enable_macos_download: true

# Windows is the same: a GitHub release, _data/windows_release.json filled by
# taigikeyboard's windows/scripts/publish-release.sh on every publish. Keep this
# false until the Windows launch is meant to be public — same two consumers.
enable_windows_download: true

