# =============================================================================
# Site Configuration
# =============================================================================

title: TaigiKeyboard 台語齒盤
description: 台語齒盤是支援 iOS 佮 Android ê 免費台語輸入法，拍字 ia̋n-jín 由台灣人開發，會當使用白話字、教育部台羅、方音符號佮漢字輸入。無廣告，嘛袂推出付費功能。
url: https://taigikeyboard.tw
lang: nan-TW
author: Bîn-hiân

# =============================================================================
# App Information
# =============================================================================

ios_app_id: 6751871806
ios_app_country: TW
appstore_link: https://apps.apple.com/app/id6751871806
playstore_link: https://play.google.com/store/apps/details?id=com.siansiansu.taigikeyboard

enable_smart_app_banner: true
enable_features: false

# macOS is distributed from a GitHub release rather than a store, and the
# release flow fills _data/macos_release.json as soon as any package is
# published. Keep this false until the macOS launch is meant to be public: it
# hides the download button AND keeps the package URL out of the page's
# structured data.
enable_macos_download: true

# Windows is the same: a GitHub release, _data/windows_release.json filled by
# taigikeyboard's windows/scripts/publish-release.sh on every publish. Keep this
# false until the Windows launch is meant to be public — same two consumers.
enable_windows_download: true

# Linux is the same: a `.deb`, a Fedora `.rpm` and an Arch `.pkg.tar.zst` on
# the desktop GitHub release, _data/linux_release.json /
# linux_rpm_release.json / linux_arch_release.json filled by taigikeyboard's
# scripts/announce-release.sh on every publish. There is no appcast — a Linux
# package is not updated in place. Keep this false until the Linux launch is meant to
# be public: it hides the button, the install tab and the JSON-LD URL, not the
# `.deb` itself, which is public the moment the release is published.
enable_linux_download: true

# =============================================================================
# SEO
# =============================================================================

keywords: 台語, 臺語, 台文, 台語輸入法, 台語鍵盤, 台語齒盤, 台羅, Tâi-lô, 白話字, POJ, Pe̍h-ōe-jī, Tâi-gí, Taigi, Taiwanese, PhahTaigi, 粉圓字型, 台語APP, 台語軟體

logo: /assets/icon/180.png
# jekyll-seo-tag reads `page.image` only, so the OG cover is set as a
# front-matter default for every page rather than a site-level key.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-cover.png
twitter:
  card: summary_large_image

